name: NabdhGram owner-signed Release APK

# Private manual release only. CI never invents a signing key or falls back to
# Telegram's bundled sample key. Only maintainers with repository permissions
# can dispatch this from main after approved real-device QA.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: nabdhgram-production-signing
  cancel-in-progress: false

jobs:
  android-validation:
    if: ${{ github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/nabdhgram-identity-build.yml
    with:
      dialog_cell_validation: true
    secrets:
      NABDHGRAM_API_ID: ${{ secrets.NABDHGRAM_API_ID }}
      NABDHGRAM_API_HASH: ${{ secrets.NABDHGRAM_API_HASH }}

  signed-release:
    needs: android-validation
    uses: ./.github/workflows/nabdhgram-identity-build.yml
    with:
      release_mode: true
      publish_artifacts: true
    secrets: inherit
