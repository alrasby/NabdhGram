name: NabdhGram identity debug build

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - design/glass-chat-cards
      - design/glass-pinned-group-container

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout NabdhGram automation
        uses: actions/checkout@v4
        with:
          path: nabdhgram
      - name: Configure Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore Gradle dependency and build caches
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --licenses < <(yes) >/dev/null
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
          NDK_DIR="$ANDROID_HOME/ndk/27.2.12479018"
          for attempt in 1 2 3; do
            echo "Installing NDK 27.2.12479018 (attempt $attempt of 3)"
            if "$SDKMANAGER" --install "ndk;27.2.12479018" && \
               test -x "$NDK_DIR/ndk-build" && \
               grep -q '^Pkg.Revision = 27.2.12479018$' "$NDK_DIR/source.properties"; then
              echo "NDK installation verified: $NDK_DIR"
              break
            fi
            echo "::warning::NDK install attempt $attempt failed or incomplete"
            if [ "$attempt" -eq 3 ]; then
              echo "::error::NDK installation failed after 3 attempts; check SDK download/archive integrity"
              exit 1
            fi
            rm -rf "$NDK_DIR"
            sleep $((attempt * 15))
          done
      - name: Checkout pinned Telegram source
        shell: bash
        run: |
          set -euo pipefail
          COMMIT="$(tr -d '\r\n' < nabdhgram/upstream/TELEGRAM_COMMIT)"
          [[ "$COMMIT" =~ ^[a-f0-9]{40}$ ]]
          git clone --filter=blob:none https://github.com/DrKLO/Telegram.git Telegram-upstream
          git -C Telegram-upstream checkout --detach "$COMMIT"
          git -C Telegram-upstream submodule update --init --recursive --depth=1 --jobs=4
          bash nabdhgram/scripts/verify-upstream.sh Telegram-upstream
      - name: Apply NabdhGram package and label overlay
        shell: bash
        run: |
          set -euo pipefail
          python3 nabdhgram/scripts/apply-identity.py Telegram-upstream 2>&1 | tee identity-patch.log
          grep -qx 'APP_PACKAGE=net.nabdhserv.nabdhgram' Telegram-upstream/gradle.properties
          grep -q 'NabdhGramAppName' Telegram-upstream/TMessagesProj_App/src/main/AndroidManifest.xml

      - name: Configure developer-owned Telegram API credentials
        shell: bash
        env:
          NABDHGRAM_API_ID: ${{ secrets.NABDHGRAM_API_ID }}
          NABDHGRAM_API_HASH: ${{ secrets.NABDHGRAM_API_HASH }}
        run: |
          set -euo pipefail
          python3 nabdhgram/scripts/apply-telegram-api.py Telegram-upstream

      - name: Install image processing dependency once
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check Pillow

      - name: Apply exact approved icon when source asset is present
        id: brand
        shell: bash
        run: |
          set -euo pipefail
          MASTER="nabdhgram/branding/approved/AppIcon.png"
          if [ -f "$MASTER" ]; then
            python3 nabdhgram/scripts/apply-brand-icons.py Telegram-upstream "$MASTER"
            echo "icon_status=approved-AppIcon-applied" >> "$GITHUB_OUTPUT"
            echo "Approved icon source SHA-256:"
            sha256sum "$MASTER"
          else
            echo "icon_status=not-configured" >> "$GITHUB_OUTPUT"
            echo "::error::Approved launcher image missing: branding/approved/AppIcon.png"
            exit 1
          fi

      - name: Apply NabdhGram welcome screen copy
        shell: bash
        run: |
          set -euo pipefail
          python3 nabdhgram/scripts/apply-welcome.py Telegram-upstream

      - name: Apply approved transparent welcome logo when available
        shell: bash
        run: |
          set -euo pipefail
          LOGO="nabdhgram/branding/approved/nabdhgram-welcome-transparent.png"
          if [ -f "$LOGO" ]; then
            python3 nabdhgram/scripts/apply-welcome-logo.py Telegram-upstream "$LOGO"
            echo "Approved compact welcome logo integrated."
          else
            echo "::notice::Welcome logo not committed yet: branding/approved/nabdhgram-welcome-transparent.png"
          fi

      - name: Apply theme-aware NabdhGram Glass login styling
        shell: bash
        run: |
          set -euo pipefail
          python3 nabdhgram/scripts/apply-glass-login.py Telegram-upstream

      - name: Apply NabdhGram main chats title
        shell: bash
        run: |
          set -euo pipefail
          python3 nabdhgram/scripts/apply-dialogs-title.py Telegram-upstream

      - name: Apply NabdhGram settings hub and credits
        shell: bash
        run: |
          set -euo pipefail
          python3 nabdhgram/scripts/apply-nabdhgram-settings.py Telegram-upstream

      - name: Apply opt-in Privacy Screen
        shell: bash
        run: |
          set -euo pipefail
          python3 nabdhgram/scripts/apply-privacy-screen.py Telegram-upstream

      - name: Apply nested NabdhGram feature settings
        shell: bash
        run: |
          set -euo pipefail
          python3 nabdhgram/scripts/apply-nested-feature-settings.py Telegram-upstream

      - name: Register NabdhGram bundled theme presets
        shell: bash
        run: |
          set -euo pipefail
          python3 nabdhgram/scripts/apply-nabdh-bundled-themes.py Telegram-upstream

      - name: Bundle licensed Readex Pro font
        shell: bash
        run: |
          set -euo pipefail
          FONT="nabdhgram/branding/fonts/ReadexPro.ttf"
          test -s "$FONT"
          python3 - "$FONT" <<'PY'
          import pathlib, sys
          p = pathlib.Path(sys.argv[1])
          if p.read_bytes()[:4] not in (b"\x00\x01\x00\x00", b"OTTO"):
              raise SystemExit("Readex Pro font has an invalid sfnt signature")
          PY
          test -s nabdhgram/branding/fonts/OFL-ReadexPro.txt
          mkdir -p Telegram-upstream/TMessagesProj/src/main/assets/fonts
          cp "$FONT" Telegram-upstream/TMessagesProj/src/main/assets/fonts/ReadexPro.ttf

      - name: Bundle pinned OFL Arabic fonts
        shell: bash
        run: |
          set -euo pipefail
          python3 nabdhgram/scripts/install-open-fonts.py Telegram-upstream

      - name: Apply persisted typography to Telegram text rendering
        shell: bash
        run: |
          set -euo pipefail
          python3 nabdhgram/scripts/apply-glass-global-font.py Telegram-upstream

      - name: Apply saved font to native Telegram labels
        shell: bash
        run: |
          set -euo pipefail
          python3 nabdhgram/scripts/apply-glass-global-textviews.py Telegram-upstream

      - name: Apply NabdhGram Glass settings design
        shell: bash
        run: |
          set -euo pipefail
          python3 nabdhgram/scripts/apply-glass-settings.py Telegram-upstream

      - name: Apply NabdhGram Glass chat cards
        shell: bash
        run: |
          set -euo pipefail
          python3 nabdhgram/scripts/apply-glass-dialog-cards.py Telegram-upstream

      - name: Clip pressed dialog selection to Glass card corners
        shell: bash
        run: |
          set -euo pipefail
          python3 nabdhgram/scripts/apply-glass-selector.py Telegram-upstream

      - name: Apply rounded Glass chat bubble defaults
        shell: bash
        run: |
          set -euo pipefail
          python3 nabdhgram/scripts/apply-glass-bubble-radius.py Telegram-upstream

      - name: Align native settings section headings
        shell: bash
        run: |
          set -euo pipefail
          python3 nabdhgram/scripts/apply-glass-header-insets.py Telegram-upstream

      - name: Center unread badge numerals
        shell: bash
        run: |
          set -euo pipefail
          python3 nabdhgram/scripts/apply-glass-badge-centering.py Telegram-upstream

      - name: Apply rounded Glass message composer
        shell: bash
        run: |
          set -euo pipefail
          python3 nabdhgram/scripts/apply-glass-chat-composer.py Telegram-upstream

      - name: Correct document title and subtitle spacing
        shell: bash
        run: |
          set -euo pipefail
          python3 nabdhgram/scripts/apply-glass-document-layout.py Telegram-upstream

      - name: Apply NabdhGram Glass pinned and regular chat sections
        shell: bash
        run: |
          set -euo pipefail
          python3 nabdhgram/scripts/apply-glass-dialog-sections.py Telegram-upstream

      - name: Align names across Arabic chat and archive lists
        shell: bash
        run: |
          set -euo pipefail
          python3 nabdhgram/scripts/apply-glass-dialog-typography.py Telegram-upstream

      - name: Apply rounded Glass contacts touch feedback
        shell: bash
        run: |
          set -euo pipefail
          python3 nabdhgram/scripts/apply-glass-contacts.py Telegram-upstream

      - name: Apply Glass native settings and profile selectors
        shell: bash
        run: |
          set -euo pipefail
          python3 nabdhgram/scripts/apply-glass-native-settings-profile.py Telegram-upstream

      - name: Apply tested contacts permission policy
        shell: bash
        run: |
          set -euo pipefail
          python3 nabdhgram/scripts/apply-contacts-permission-policy.py Telegram-upstream

      - name: Align NabdhGram locale and RTL layout
        shell: bash
        run: |
          set -euo pipefail
          python3 nabdhgram/scripts/apply-glass-locale-polish.py Telegram-upstream

      - name: Verify NabdhGram Glass overlays before Gradle
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile nabdhgram/scripts/apply-glass-login.py nabdhgram/scripts/apply-glass-dialog-typography.py nabdhgram/scripts/apply-glass-document-layout.py nabdhgram/scripts/apply-glass-locale-polish.py nabdhgram/scripts/apply-glass-badge-centering.py nabdhgram/scripts/apply-glass-header-insets.py nabdhgram/scripts/install-open-fonts.py nabdhgram/scripts/apply-glass-global-textviews.py nabdhgram/scripts/apply-glass-bubble-outline.py nabdhgram/scripts/apply-glass-bubble-radius.py nabdhgram/scripts/apply-glass-native-settings-profile.py nabdhgram/scripts/apply-glass-contacts.py nabdhgram/scripts/apply-glass-chat-composer.py nabdhgram/scripts/apply-glass-selector.py nabdhgram/scripts/apply-glass-global-font.py nabdhgram/scripts/apply-glass-dialog-cards.py nabdhgram/scripts/apply-glass-dialog-sections.py nabdhgram/scripts/check-glass-overlay.py nabdhgram/scripts/apply-contacts-permission-policy.py
          python3 nabdhgram/scripts/check-glass-overlay.py Telegram-upstream

      - name: Apply privacy-minimal network diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python3 nabdhgram/scripts/apply-network-diagnostics.py Telegram-upstream

      - name: Disable upstream Google Services configuration for experimental debug build
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("Telegram-upstream/TMessagesProj_App/build.gradle")
          content = p.read_text(encoding="utf-8")
          plugin = "apply plugin: 'com.google.gms.google-services'"
          if content.count(plugin) != 1:
              raise SystemExit("Expected exactly one Google Services plugin declaration")
          p.write_text(content.replace(plugin, "// Experimental NabdhGram debug build: no Firebase project configured yet"), encoding="utf-8")
          print("Google Services Gradle processing disabled for experimental debug build only.")
          PY

      - name: Limit experimental APK to arm64-v8a
        shell: bash
        run: |
          set -euo pipefail
          python3 nabdhgram/scripts/apply-arm64-debug.py Telegram-upstream

      - name: Build branded debug APK
        id: compile
        continue-on-error: true
        working-directory: Telegram-upstream
        shell: bash
        run: |
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew :TMessagesProj_App:assembleAfatDebug --no-daemon --stacktrace 2>&1 | tee ../nabdhgram-build.log
      - name: Verify APK identity and collect launcher diagnostics
        if: steps.compile.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          APK="Telegram-upstream/TMessagesProj_App/build/outputs/apk/afat/debug/app.apk"
          test -s "$APK" || { echo "::error::APK missing at $APK"; exit 1; }
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -x "$AAPT" || { echo "::error::aapt not installed"; exit 1; }
          test -x "$APKSIGNER" || { echo "::error::apksigner not installed"; exit 1; }
          "$AAPT" dump badging "$APK" > apk-badging.txt
          "$AAPT" dump resources "$APK" > apk-resources.txt
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > apk-manifest-tree.txt
          "$APKSIGNER" verify --verbose "$APK" > apk-signature.txt
          sha256sum "$APK" > apk-sha256.txt
          echo "::group::Packaged APK identity and launcher"
          grep -E "^(package:|application-label:|launchable-activity:|sdkVersion:|targetSdkVersion:|application-icon)" apk-badging.txt || true
          echo "::endgroup::"
          echo "::group::Signature and checksum"
          cat apk-signature.txt apk-sha256.txt
          echo "::endgroup::"
          python3 - <<'PY'
          import pathlib
          import re
          import sys

          badging = pathlib.Path("apk-badging.txt").read_text()
          signing = pathlib.Path("apk-signature.txt").read_text()
          resources = pathlib.Path("apk-resources.txt").read_text()
          manifest = pathlib.Path("apk-manifest-tree.txt").read_text()
          def require(condition, message):
              if not condition:
                  print(f"::error::{message}", flush=True)
                  sys.exit(1)
              print(f"PASS: {message}", flush=True)

          require("package: name='net.nabdhserv.nabdhgram'" in badging,
                  "Expected NabdhGram independent package")
          require("application-label:'NabdhGram'" in badging,
                  "Expected NabdhGram launcher label")
          require("Verified using v2 scheme (APK Signature Scheme v2): true" in signing,
                  "Valid APK v2 signature")
          launcher = re.search(r"^launchable-activity:.*$", badging, re.MULTILINE)
          if launcher is None:
              print("::warning::aapt badging did not emit launchable-activity; inspect compiled manifest activity aliases.", flush=True)
          else:
              print("Launchable activity: " + launcher.group(0), flush=True)
          branded = "nabdhgram_launcher" in resources or "nabdhgram_launcher.xml" in badging
          if branded:
              print("PASS: NabdhGram launcher resource exists in compiled resource table", flush=True)
          else:
              print("::warning::NabdhGram launcher resource name not visible in compiled table", flush=True)
          if "org.telegram.messenger.DefaultIcon" in manifest:
              print("PASS: DefaultIcon alias exists in compiled AndroidManifest", flush=True)
          else:
              print("::warning::DefaultIcon alias not found in compiled manifest tree", flush=True)
          print("NOTE: Device launcher artwork still requires visual verification.", flush=True)
          PY
      - name: Publish verified APK with a clean filename
        if: steps.compile.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp Telegram-upstream/TMessagesProj_App/build/outputs/apk/afat/debug/app.apk dist/nabdhgram.apk
          cmp Telegram-upstream/TMessagesProj_App/build/outputs/apk/afat/debug/app.apk dist/nabdhgram.apk
          python3 - <<'PY'
          import pathlib, zipfile, sys
          apk = pathlib.Path("dist/nabdhgram.apk")
          with zipfile.ZipFile(apk) as z:
              abis = sorted({p.split("/")[1] for p in z.namelist() if p.startswith("lib/") and p.count("/") >= 2})
          print(f"Packaged native ABIs: {abis}")
          print(f"APK size: {apk.stat().st_size / 1024 / 1024:.2f} MiB")
          if abis != ["arm64-v8a"]:
              sys.exit("APK contains unexpected or missing native ABIs")
          PY
          sha256sum dist/nabdhgram.apk
          echo "### NabdhGram APK" >> "$GITHUB_STEP_SUMMARY"
          echo "Filename: \`nabdhgram.apk\` (arm64-v8a only)" >> "$GITHUB_STEP_SUMMARY"
          du -h dist/nabdhgram.apk >> "$GITHUB_STEP_SUMMARY"

      - name: Collect APK paths
        if: always()
        shell: bash
        run: |
          find Telegram-upstream -type f -name '*.apk' -print > apk-paths.txt || true
          cat apk-paths.txt
      - name: Upload APK when available
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nabdhgram-identity-debug-apk
          path: dist/nabdhgram.apk
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nabdhgram-identity-build-log
          path: |
            nabdhgram-build.log
            identity-patch.log
            apk-paths.txt
            apk-badging.txt
            apk-signature.txt
            apk-sha256.txt
            apk-resources.txt
            apk-manifest-tree.txt
          if-no-files-found: ignore
          retention-days: 14
      - name: Report status
        if: always()
        shell: bash
        run: |
          {
            echo "## NabdhGram identity build"
            echo "Gradle result: **${{ steps.compile.outcome }}**"
            echo "Expected debug ID: `net.nabdhserv.nabdhgram`"
            echo "Firebase/Google Services integration is disabled for this experimental debug build; push notifications may not work."
            echo "Launcher icon status: **${{ steps.brand.outputs.icon_status }}**" 
            echo "Developer-owned Telegram API configuration required via GitHub Actions secrets."
            echo "Do not distribute this experimental APK."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail on build error or missing APK
        if: always()
        shell: bash
        env:
          BUILD_RESULT: ${{ steps.compile.outcome }}
        run: |
          test "$BUILD_RESULT" = success
          test -s dist/nabdhgram.apk
