          test -s "$APK" || { echo "::error::APK missing at $APK"; exit 1; }
          # Final package must not contain the removed 20+ MB art payload.
          APK_PATH="$APK" python3 - <<'PY'
          import os
          import zipfile
          with zipfile.ZipFile(os.environ["APK_PATH"]) as apk:
              bundled = [name for name in apk.namelist()
