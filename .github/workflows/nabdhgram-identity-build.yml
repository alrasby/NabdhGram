          grep -E "^(package:|application-label:|launchable-activity:|sdkVersion:|targetSdkVersion:|application-icon)" apk-badging.txt || true
          echo "::endgroup::"
          echo "::group::Signature and checksum"
          cat apk-signature.txt apk-sha256.txt
          echo "::endgroup::"
          python3 - <<'PY'
          import pathlib
          import re
          import sys

          badging = pathlib.Path("apk-badging.txt").read_text()
          signing = pathlib.Path("apk-signature.txt").read_text()
          resources = pathlib.Path("apk-resources.txt").read_text()
          manifest = pathlib.Path("apk-manifest-tree.txt").read_text()
          def require(condition, message):
              if not condition:
                  print(f"::error::{message}", flush=True)
                  sys.exit(1)
              print(f"PASS: {message}", flush=True)

          require("package: name='net.nabdhserv.nabdhgram'" in badging,
                  "Expected NabdhGram independent package")
          require("application-label:'NabdhGram'" in badging,
                  "Expected NabdhGram launcher label")
          require("Verified using v2 scheme (APK Signature Scheme v2): true" in signing,
                  "Valid APK v2 signature")
          launcher = re.search(r"^launchable-activity:.*$", badging, re.MULTILINE)
          if launcher is None:
              print("::warning::aapt badging did not emit launchable-activity; inspect compiled manifest activity aliases.", flush=True)
          else:
              print("Launchable activity: " + launcher.group(0), flush=True)
          branded = "nabdhgram_launcher" in resources or "nabdhgram_launcher.xml" in badging
          if branded:
              print("PASS: NabdhGram launcher resource exists in compiled resource table", flush=True)
          else:
              print("::warning::NabdhGram launcher resource name not visible in compiled table", flush=True)
          if "org.telegram.messenger.DefaultIcon" in manifest:
              print("PASS: DefaultIcon alias exists in compiled AndroidManifest", flush=True)
          else:
              print("::warning::DefaultIcon alias not found in compiled manifest tree", flush=True)
          print("NOTE: Device launcher artwork still requires visual verification.", flush=True)
          PY
          # Inspect FINAL compiled resources, not just source XML. In build #572
          # Android night-v29 selected tg_splash_320 despite branded day-v31.
          python3 nabdhgram/scripts/check-packaged-splash.py "$APK" apk-resources.txt apk-manifest-tree.txt
          if [[ "${{ inputs.release_mode }}" == "true" ]]; then
            python3 nabdhgram/scripts/verify-release-apk.py "$APK" apk-badging.txt apk-manifest-tree.txt
          fi
      - name: Enable KVM for mandatory Android renderer regression
        if: ${{ !inputs.source_preflight_only && steps.compile.outcome == 'success' }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-nabdh-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android card renderer pixel and gesture regression
        id: card_android_gate
        if: ${{ !inputs.source_preflight_only && steps.compile.outcome == 'success' }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash nabdhgram/scripts/run-card-android-gate.sh Telegram-upstream ${{ env.DIALOG_CELL_VALIDATION == 'true' && 'Telegram-upstream/TMessagesProj_App/build/outputs/apk/afat/debug/app.apk' || '' }}
      - name: Upload Android card regression evidence
        if: ${{ always() && !inputs.source_preflight_only }}
        uses: actions/upload-artifact@v4
        with:
          name: nabdh-card-android-evidence
          path: card-android-evidence/
          if-no-files-found: ignore
          retention-days: 14
      - name: Publish verified APK with a clean filename
        if: ${{ success() && inputs.publish_artifacts && steps.compile.outcome == 'success' && steps.card_android_gate.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp Telegram-upstream/TMessagesProj_App/build/outputs/apk/afat/${{ inputs.release_mode && 'release' || 'debug' }}/app.apk dist/nabdhgram${{ inputs.release_mode && '-release' || '' }}.apk
          cmp Telegram-upstream/TMessagesProj_App/build/outputs/apk/afat/${{ inputs.release_mode && 'release' || 'debug' }}/app.apk dist/nabdhgram${{ inputs.release_mode && '-release' || '' }}.apk
          python3 - <<'PY'
          import pathlib, zipfile, sys
          apk = pathlib.Path("dist/nabdhgram${{ inputs.release_mode && '-release' || '' }}.apk")
          with zipfile.ZipFile(apk) as z:
              abis = sorted({p.split("/")[1] for p in z.namelist() if p.startswith("lib/") and p.count("/") >= 2})
          print(f"Packaged native ABIs: {abis}")
          print(f"APK size: {apk.stat().st_size / 1024 / 1024:.2f} MiB")
          if not abis or "arm64-v8a" not in abis:
              sys.exit("APK lacks arm64 native libraries")
          if "${{ inputs.release_mode }}" != "true" and abis != ["arm64-v8a"]:
              sys.exit("Debug ABI filter changed")
          if "${{ inputs.release_mode }}" == "true" and "armeabi-v7a" not in abis:
              sys.exit("Release is missing 32-bit ARM libraries")
          PY
          sha256sum dist/nabdhgram${{ inputs.release_mode && '-release' || '' }}.apk
          python3 nabdhgram/scripts/report-apk-size.py dist/nabdhgram${{ inputs.release_mode && '-release' || '' }}.apk | tee apk-size-audit.md
          cat apk-size-audit.md >> "$GITHUB_STEP_SUMMARY"
          echo "### NabdhGram APK" >> "$GITHUB_STEP_SUMMARY"
          echo "APK mode: ${{ inputs.release_mode && 'privately signed Release' || 'experimental Debug' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Filename: nabdhgram${{ inputs.release_mode && '-release' || '' }}.apk" >> "$GITHUB_STEP_SUMMARY"
          du -h dist/nabdhgram${{ inputs.release_mode && '-release' || '' }}.apk >> "$GITHUB_STEP_SUMMARY"

      - name: Build owner-signed Android App Bundle for Google Play testing
        if: ${{ inputs.release_mode && steps.compile.outcome == 'success' }}
        working-directory: Telegram-upstream
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :TMessagesProj_App:bundleBundleAfatRelease --no-daemon --stacktrace 2>&1 | tee ../nabdhgram-play-bundle-build.log

      - name: Validate and preserve Play upload AAB
        if: ${{ inputs.release_mode && steps.compile.outcome == 'success' }}
        shell: bash
        env:
          NABDH_RELEASE_CERT_SHA256: ${{ secrets.NABDH_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          mapfile -t bundles < <(find Telegram-upstream/TMessagesProj_App/build/outputs/bundle/ -type f -name '*.aab')
          if [[ "${#bundles[@]}" != "1" ]]; then
            echo "::error::Expected exactly one owner-signed Release AAB, found ${#bundles[@]}"
            exit 1
          fi
          python3 nabdhgram/scripts/verify-release-aab.py "${bundles[0]}"
          python3 nabdhgram/scripts/report-play-aab-size.py "${bundles[0]}" | tee play-bundle-size-audit.md
          cat play-bundle-size-audit.md >> "$GITHUB_STEP_SUMMARY"
          python3 nabdhgram/scripts/check-nabdh-16kb-elf.py "${bundles[0]}" --enforce
          mkdir -p dist
          cp "${bundles[0]}" dist/nabdhgram-play-internal.aab
          sha256sum dist/nabdhgram-play-internal.aab > play-bundle-sha256.txt
          du -h dist/nabdhgram-play-internal.aab >> "$GITHUB_STEP_SUMMARY"
          echo "Google Play testing upload: owner-signed nabdhgram-play-internal.aab" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verified Google Play internal-test AAB
        if: ${{ inputs.release_mode && steps.compile.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: nabdhgram-owner-signed-google-play-aab
          path: dist/nabdhgram-play-internal.aab
          if-no-files-found: error
          retention-days: 7

      - name: Collect APK paths
        if: ${{ always() && !inputs.source_preflight_only }}
        shell: bash
        run: |
          find Telegram-upstream -type f -name '*.apk' -print > apk-paths.txt || true
          cat apk-paths.txt
      - name: Upload APK when available
        if: ${{ success() && inputs.publish_artifacts && steps.card_android_gate.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.release_mode && 'nabdhgram-owner-signed-release-apk' || 'nabdhgram-identity-debug-apk' }}
          path: dist/nabdhgram*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload diagnostics
        if: ${{ always() && !inputs.source_preflight_only }}
        uses: actions/upload-artifact@v4
        with:
          name: nabdhgram-identity-build-log
          path: |
            nabdhgram-build.log
            nabdhgram-play-bundle-build.log
            play-bundle-sha256.txt
            play-bundle-size-audit.md
            apk-size-audit.md
            nabdhgram-manifest-check.log
            identity-patch.log
            apk-paths.txt
            apk-badging.txt
            apk-signature.txt
            apk-sha256.txt
            apk-resources.txt
            apk-manifest-tree.txt
            apk-permissions.txt
          if-no-files-found: ignore
          retention-days: 14
      - name: Report status
        if: ${{ always() && !inputs.source_preflight_only }}
        shell: bash
        run: |
          {
            echo "## NabdhGram identity build"
            echo "Gradle result: **${{ steps.compile.outcome }}**"
            echo "Package: net.nabdhserv.nabdhgram"
            echo "Build mode: ${{ inputs.release_mode && 'owner-signed Release' || 'experimental Debug with Firebase disabled' }}"
            echo "Launcher icon: **${{ steps.brand.outputs.icon_status }}**"
            echo "Public distribution additionally needs license/privacy and final device QA."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Erase private release keys from ephemeral build workspace
        if: ${{ always() && inputs.release_mode }}
        shell: bash
        run: |
          rm -f Telegram-upstream/TMessagesProj/config/release.keystore Telegram-upstream/TMessagesProj_App/google-services.json
          if [ -f Telegram-upstream/gradle.properties ]; then
            sed -i -E 's/^(RELEASE_(STORE_PASSWORD|KEY_ALIAS|KEY_PASSWORD))=.*/\1=REMOVED/' Telegram-upstream/gradle.properties
          fi
      - name: Fail on build error or missing APK
        if: ${{ always() && !inputs.source_preflight_only }}
        shell: bash
        env:
          BUILD_RESULT: ${{ steps.compile.outcome }}
          PUBLISH_ARTIFACTS: ${{ inputs.publish_artifacts }}
        run: |
          test "$BUILD_RESULT" = success
          test "${{ steps.card_android_gate.outcome }}" = success
          if [[ "$DIALOG_CELL_VALIDATION" == true ]]; then
            test -s card-android-evidence/dialog-android.log
            test -s card-android-evidence/dialog-rest.png
            test -s card-android-evidence/verify-theme.log
            grep -Fq 'THEME_RESTART_PASS: verify-theme' card-android-evidence/verify-theme.log
          elif [[ "$PUBLISH_ARTIFACTS" != true ]]; then
            test -s apk-sha256.txt
            test -s apk-signature.txt
            test -s Telegram-upstream/TMessagesProj_App/build/outputs/apk/afat/debug/app.apk
          else
            test -s dist/nabdhgram${{ inputs.release_mode && '-release' || '' }}.apk
          fi
