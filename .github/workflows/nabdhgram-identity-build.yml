name: NabdhGram identity debug build

# A branch with an open PR produces two events for the same commit if both
# push and pull_request are enabled. Their concurrency cancellation previously
# killed the real Android build before it reached Gradle.
# Build the PR head exactly once; workflow_dispatch supports manual branch runs.
on:
  workflow_call:
    inputs:
      source_preflight_only:
        description: 'Run every source overlay and API check but skip native compilation'
        type: boolean
        required: false
        default: false
      release_mode:
        description: 'Private production-signed Release (requires secrets and manual main dispatch)'
        type: boolean
        required: false
        default: false
      dialog_cell_validation:
        description: 'Run the production Android app and instrumented appearance tests'
        type: boolean
        default: false
      publish_artifacts:
        description: 'Upload APK after the calling workflow has completed real Android validation'
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      source_preflight_only:
        description: 'Validate every upstream overlay without native SDK, NDK or Gradle'
        required: false
        default: false
        type: boolean
      dialog_cell_validation:
        description: 'Build an internal x86_64 debug target and exercise the real DialogCell without publishing an APK'
        required: false
        default: false
        type: boolean
      internal_phone_build:
        description: 'Build and verify the ARM64 debug APK without publishing it'
        required: false
        default: false
        type: boolean
  pull_request:
    branches:
      - main
  # Build the accepted upgrade once from the real main head, not only the
  # ephemeral PR branch. Avoid spending a full NDK build on docs-only edits.
  push:
    branches:
      - main
    paths:
      - 'upstream/**'
      - 'scripts/**'
      - 'overlay/**'
      - 'branding/**'
      - '.github/workflows/nabdhgram-identity-build.yml'

permissions:
  contents: read

# Supersede older *PR* commits only. Never cancel a manual dispatch because
# the very same branch also received a pull_request event.
concurrency:
  group: nabdhgram-android-${{ inputs.source_preflight_only && 'preflight' || inputs.dialog_cell_validation && 'dialog-cell' || inputs.internal_phone_build && 'internal-phone' || 'full' }}-${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      DIALOG_CELL_VALIDATION: ${{ inputs.dialog_cell_validation || (github.event_name == 'pull_request' && !inputs.source_preflight_only) }}
    steps:
      - name: Checkout NabdhGram automation
        uses: actions/checkout@v4
        with:
          path: nabdhgram
      - name: Validate Android build mode
        env:
          PUBLISH_ARTIFACTS: ${{ inputs.publish_artifacts }}
          RELEASE_MODE: ${{ inputs.release_mode }}
          SOURCE_PREFLIGHT: ${{ inputs.source_preflight_only }}
          INTERNAL_PHONE_BUILD: ${{ inputs.internal_phone_build }}
        run: |
          if [[ "$DIALOG_CELL_VALIDATION" == true || "$INTERNAL_PHONE_BUILD" == true ]]; then
            test "$RELEASE_MODE" != true
            test "$SOURCE_PREFLIGHT" != true
            test "$PUBLISH_ARTIFACTS" != true
          fi
          if [[ "$DIALOG_CELL_VALIDATION" == true ]]; then
            test "$INTERNAL_PHONE_BUILD" != true
          fi
          if [[ "$RELEASE_MODE" == true ]]; then
            test "$PUBLISH_ARTIFACTS" = true
          fi
          if [[ "$PUBLISH_ARTIFACTS" == true ]]; then
            test "$GITHUB_EVENT_NAME" = workflow_dispatch
            test "$SOURCE_PREFLIGHT" != true
          fi
      - name: Validate private Release dispatch before cloning sources
        if: ${{ inputs.release_mode }}
        shell: bash
        env:
          NABDH_RELEASE_KEYSTORE_B64: ${{ secrets.NABDH_RELEASE_KEYSTORE_B64 }}
          NABDH_RELEASE_STORE_PASSWORD: ${{ secrets.NABDH_RELEASE_STORE_PASSWORD }}
          NABDH_RELEASE_KEY_ALIAS: ${{ secrets.NABDH_RELEASE_KEY_ALIAS }}
          NABDH_RELEASE_KEY_PASSWORD: ${{ secrets.NABDH_RELEASE_KEY_PASSWORD }}
          NABDH_RELEASE_CERT_SHA256: ${{ secrets.NABDH_RELEASE_CERT_SHA256 }}
          NABDH_FIREBASE_CONFIG_B64: ${{ secrets.NABDH_FIREBASE_CONFIG_B64 }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" || "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]]; then
            echo "::error::Signed release only allowed from a manual main dispatch"
            exit 1
          fi
          for name in NABDH_RELEASE_KEYSTORE_B64 NABDH_RELEASE_STORE_PASSWORD NABDH_RELEASE_KEY_ALIAS NABDH_RELEASE_KEY_PASSWORD NABDH_RELEASE_CERT_SHA256 NABDH_FIREBASE_CONFIG_B64; do
            if [[ -z "${!name:-}" ]]; then echo "::error::Missing project-owned release secret: $name"; exit 1; fi
          done
      - name: Configure Java 21 for Java 21 MediaPipe AI library
        if: ${{ !inputs.source_preflight_only }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Restore Gradle dependency and build caches
        if: ${{ !inputs.source_preflight_only }}
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Checkout pinned Telegram source
        shell: bash
        run: |
          set -euo pipefail
          COMMIT="$(tr -d '\r\n' < nabdhgram/upstream/TELEGRAM_COMMIT)"
          [[ "$COMMIT" =~ ^[a-f0-9]{40}$ ]]
          git clone --filter=blob:none https://github.com/DrKLO/Telegram.git Telegram-upstream
          git -C Telegram-upstream checkout --detach "$COMMIT"
          test "$(git -C Telegram-upstream rev-parse HEAD)" = "$COMMIT"
          # Source-only Glass overlays do not use native submodules. Defer
          # recursive checkout until ALL generated-source checks have passed.
      - name: Export exact pinned public source for card engine review
        if: ${{ inputs.source_preflight_only }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p card-source-review
          for f in TMessagesProj/src/main/java/org/telegram/ui/Cells/DialogCell.java TMessagesProj/src/main/java/org/telegram/ui/DialogsActivity.java TMessagesProj/src/main/java/org/telegram/messenger/MessagesController.java TMessagesProj/src/main/java/org/telegram/ui/Components/RecyclerListView.java; do
            git -C Telegram-upstream show "HEAD:$f" > "card-source-review/$(basename "$f")"
          done
          git -C Telegram-upstream rev-parse HEAD > card-source-review/UPSTREAM_COMMIT
      - name: Publish pinned card source review
        if: ${{ inputs.source_preflight_only }}
        uses: actions/upload-artifact@v4
        with:
          name: pinned-card-source-review
          path: card-source-review/
          if-no-files-found: error
          retention-days: 7

      - name: Apply NabdhGram package and label overlay
        shell: bash
        run: |
          set -euo pipefail
          python3 nabdhgram/scripts/apply-identity.py Telegram-upstream 2>&1 | tee identity-patch.log
          grep -qx 'APP_PACKAGE=net.nabdhserv.nabdhgram' Telegram-upstream/gradle.properties
          grep -q 'NabdhGramAppName' Telegram-upstream/TMessagesProj_App/src/main/AndroidManifest.xml

      - name: Configure developer-owned Telegram API credentials
        shell: bash
        env:
          NABDHGRAM_API_ID: ${{ secrets.NABDHGRAM_API_ID }}
          NABDHGRAM_API_HASH: ${{ secrets.NABDHGRAM_API_HASH }}
        run: |
          set -euo pipefail
          python3 nabdhgram/scripts/apply-telegram-api.py Telegram-upstream

      - name: Install image processing dependency once
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check Pillow

      - name: Apply exact approved icon when source asset is present
        id: brand
        shell: bash
        run: |
          set -euo pipefail
          MASTER="nabdhgram/branding/approved/AppIcon.png"
          if [ -f "$MASTER" ]; then
            python3 nabdhgram/scripts/apply-brand-icons.py Telegram-upstream "$MASTER"
            echo "icon_status=approved-AppIcon-applied" >> "$GITHUB_OUTPUT"
            echo "Approved icon source SHA-256:"
            sha256sum "$MASTER"
          else
            echo "icon_status=not-configured" >> "$GITHUB_OUTPUT"
            echo "::error::Approved launcher image missing: branding/approved/AppIcon.png"
            exit 1
          fi

      - name: Install four approved modern adaptive NabdhGram icon variants
        run: |
          python3 nabdhgram/scripts/apply-nabdh-approved-icon-variants.py Telegram-upstream

      - name: Export and verify four approved adaptive Android icon packs
        shell: bash
        run: |
          set -euo pipefail
          python3 nabdhgram/scripts/package-nabdh-android-icons.py Telegram-upstream nabdhgram-icons-android.zip

      - name: Upload downloadable icon ZIP (five Android densities)
        uses: actions/upload-artifact@v4
        with:
          name: nabdhgram-four-icons-android-${{ github.run_number }}
          path: nabdhgram-icons-android.zip
          if-no-files-found: error
          retention-days: 30

      - name: Apply NabdhGram welcome screen copy
        shell: bash
        run: |
          set -euo pipefail
          python3 nabdhgram/scripts/apply-welcome.py Telegram-upstream

      - name: Apply approved transparent welcome logo when available
        shell: bash
        run: |
          set -euo pipefail
          LOGO="nabdhgram/branding/approved/nabdhgram-welcome-transparent.png"
          if [ -f "$LOGO" ]; then
            python3 nabdhgram/scripts/apply-welcome-logo.py Telegram-upstream "$LOGO"
            echo "Approved compact welcome logo integrated."
          else
            echo "::notice::Welcome logo not committed yet: branding/approved/nabdhgram-welcome-transparent.png"
          fi

      - name: Apply theme-aware NabdhGram Glass login styling
        shell: bash
        run: |
          set -euo pipefail
          python3 nabdhgram/scripts/apply-glass-login.py Telegram-upstream

      - name: Apply NabdhGram main chats title
        shell: bash
        run: |
          set -euo pipefail
          python3 nabdhgram/scripts/apply-dialogs-title.py Telegram-upstream

      - name: Apply NabdhGram settings hub and credits
        shell: bash
        run: |
          set -euo pipefail
          python3 nabdhgram/scripts/apply-nabdhgram-settings.py Telegram-upstream

      - name: Apply opt-in Privacy Screen
        shell: bash
        run: |
          set -euo pipefail
          python3 nabdhgram/scripts/apply-privacy-screen.py Telegram-upstream

      - name: Apply nested NabdhGram feature settings
        shell: bash
        run: |
          set -euo pipefail
          python3 nabdhgram/scripts/apply-nested-feature-settings.py Telegram-upstream

      - name: Register NabdhGram bundled theme presets
        shell: bash
        run: |
          set -euo pipefail
          python3 nabdhgram/scripts/apply-nabdh-bundled-themes.py Telegram-upstream

      - name: Bundle licensed Readex Pro font
        shell: bash
        run: |
          set -euo pipefail
          FONT="nabdhgram/branding/fonts/ReadexPro.ttf"
          test -s "$FONT"
          python3 - "$FONT" <<'PY'
          import pathlib, sys
          p = pathlib.Path(sys.argv[1])
          if p.read_bytes()[:4] not in (b"\x00\x01\x00\x00", b"OTTO"):
              raise SystemExit("Readex Pro font has an invalid sfnt signature")
          PY
          test -s nabdhgram/branding/fonts/OFL-ReadexPro.txt
          mkdir -p Telegram-upstream/TMessagesProj/src/main/assets/fonts
          cp "$FONT" Telegram-upstream/TMessagesProj/src/main/assets/fonts/ReadexPro.ttf

      - name: Bundle pinned OFL Arabic and Latin Noto fonts
        shell: bash
        run: |
          set -euo pipefail
          python3 nabdhgram/scripts/install-open-fonts.py Telegram-upstream
          python3 -m py_compile nabdhgram/scripts/check-nabdh-noto-fonts.py
          python3 nabdhgram/scripts/check-nabdh-noto-fonts.py --self-test
          python3 nabdhgram/scripts/check-nabdh-noto-fonts.py Telegram-upstream/TMessagesProj/src/main/assets/fonts

      - name: Apply persisted typography to Telegram text rendering
        shell: bash
        run: |
          set -euo pipefail
          python3 nabdhgram/scripts/apply-glass-global-font.py Telegram-upstream

      - name: Apply selected font to native canvas-drawn chat messages
        shell: bash
        run: |
          set -euo pipefail
          python3 nabdhgram/scripts/apply-glass-chat-typefaces.py Telegram-upstream

      - name: Apply saved font to native Telegram labels
        shell: bash
        run: |
          set -euo pipefail
          python3 nabdhgram/scripts/apply-glass-global-textviews.py Telegram-upstream

      - name: Fix RTL notification detail fade and rebind selected Arabic text
        shell: bash
        run: |
          set -euo pipefail
          python3 nabdhgram/scripts/apply-nabdh-notification-typography.py Telegram-upstream

      - name: Apply NabdhGram Glass settings design
        shell: bash
        run: |
          set -euo pipefail
          python3 nabdhgram/scripts/apply-glass-settings.py Telegram-upstream

      - name: Apply NabdhGram Glass chat cards
        shell: bash
        run: |
          set -euo pipefail
          python3 nabdhgram/scripts/apply-glass-dialog-cards.py Telegram-upstream
          python3 nabdhgram/scripts/apply-nabdh-selection-toolbar.py Telegram-upstream

      - name: Clip pressed dialog selection to Glass card corners
        shell: bash
        run: |
          set -euo pipefail
          python3 nabdhgram/scripts/apply-glass-selector.py Telegram-upstream

      - name: Install Smart Swipe V1 actions, reminders, and dual-direction reveal
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile nabdhgram/scripts/apply-nabdh-smart-swipe.py
          python3 nabdhgram/scripts/apply-nabdh-smart-swipe.py Telegram-upstream

      - name: Apply rounded Glass chat bubble defaults
        shell: bash
        run: |
          set -euo pipefail
          python3 nabdhgram/scripts/apply-glass-bubble-radius.py Telegram-upstream

      - name: Add theme-aware outlines to gradient chat bubbles
        shell: bash
        run: |
          set -euo pipefail
          python3 nabdhgram/scripts/apply-glass-bubble-outline.py Telegram-upstream

      - name: Align native settings section headings
        shell: bash
        run: |
          set -euo pipefail
          python3 nabdhgram/scripts/apply-glass-header-insets.py Telegram-upstream

      - name: Center unread badge numerals
        shell: bash
        run: |
          set -euo pipefail
          python3 nabdhgram/scripts/apply-glass-badge-centering.py Telegram-upstream

      - name: Apply rounded Glass message composer
        shell: bash
        run: |
          set -euo pipefail
          python3 nabdhgram/scripts/apply-glass-chat-composer.py Telegram-upstream

      - name: Correct document title and subtitle spacing
        shell: bash
        run: |
          set -euo pipefail
          python3 nabdhgram/scripts/apply-glass-document-layout.py Telegram-upstream

      - name: Apply NabdhGram Glass pinned and regular chat sections
        shell: bash
        run: |
          set -euo pipefail
          python3 nabdhgram/scripts/apply-glass-dialog-sections.py Telegram-upstream

      - name: Align names across Arabic chat and archive lists
        shell: bash
        run: |
          set -euo pipefail
          python3 nabdhgram/scripts/apply-glass-dialog-typography.py Telegram-upstream

      - name: Apply rounded Glass contacts touch feedback
        shell: bash
        run: |
          set -euo pipefail
          python3 nabdhgram/scripts/apply-glass-contacts.py Telegram-upstream

      - name: Apply colored Experimental and Debug settings icons
        shell: bash
        run: |
          set -euo pipefail
          python3 nabdhgram/scripts/apply-glass-diagnostic-icons.py Telegram-upstream

      - name: Apply Glass native settings and profile selectors
        shell: bash
        run: |
          set -euo pipefail
          python3 nabdhgram/scripts/apply-glass-native-settings-profile.py Telegram-upstream

      - name: Apply tested contacts permission policy
        shell: bash
        run: |
          set -euo pipefail
          python3 nabdhgram/scripts/apply-contacts-permission-policy.py Telegram-upstream

      - name: Align NabdhGram locale and RTL layout
        shell: bash
        run: |
          set -euo pipefail
          python3 nabdhgram/scripts/apply-glass-locale-polish.py Telegram-upstream

      - name: Finish NabdhGram Glass screens and layout geometry
        shell: bash
        run: |
          set -euo pipefail
          python3 nabdhgram/scripts/apply-glass-final-screens.py Telegram-upstream

      - name: Finish Telegram-native Glass widgets and RTL verified names
        shell: bash
        run: |
          set -euo pipefail
          python3 nabdhgram/scripts/apply-glass-v1-finishing.py Telegram-upstream

      - name: Finalize polished login keypad and private code-route diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python3 nabdhgram/scripts/apply-glass-login-finish.py Telegram-upstream

      - name: Integrate native Telegram QR-code login
        run: |
          python3 nabdhgram/scripts/apply-nabdh-qr-login.py Telegram-upstream

      - name: Route QR approval update to native LoginActivity
        shell: bash
        run: |
          set -euo pipefail
          python3 nabdhgram/scripts/apply-nabdh-qr-signal.py Telegram-upstream

      - name: Dismiss MTProxy promotional channel through native Telegram API
        shell: bash
        run: |
          set -euo pipefail
          python3 nabdhgram/scripts/apply-hide-proxy-promo.py Telegram-upstream

      - name: Keep NabdhGram Arabic translations in Android APK
        shell: bash
        run: |
          set -euo pipefail
          python3 nabdhgram/scripts/apply-nabdh-arabic-resources.py Telegram-upstream

      - name: Apply unified Glass to native privacy, notifications, data and theme settings
        shell: bash
        run: |
          set -euo pipefail
          python3 nabdhgram/scripts/apply-glass-settings-surfaces.py Telegram-upstream
          python3 nabdhgram/scripts/apply-nabdh-physical-toggle-hitboxes.py Telegram-upstream

      - name: Complete Glass coverage on folder and power saving settings
        shell: bash
        run: |
          set -euo pipefail
          python3 nabdhgram/scripts/apply-glass-remaining-settings.py Telegram-upstream

      - name: Fix icon clipping, chat-list samples and left-side toggle geometry
        shell: bash
        run: |
          set -euo pipefail
          python3 nabdhgram/scripts/apply-chat-settings-visual-fixes.py Telegram-upstream

      - name: Apply Nabdh Liquid Glass and local Context Lens
        shell: bash
        run: |
          set -euo pipefail
          python3 nabdhgram/scripts/apply-nabdh-liquid-intelligence.py Telegram-upstream

      - name: Install real local V1 Shield, Focus, recap, and encrypted Workspace tools
        shell: bash
        run: |
          set -euo pipefail
          python3 nabdhgram/scripts/apply-nabdh-v1-signatures.py Telegram-upstream
          python3 nabdhgram/scripts/apply-nabdh-v1-hierarchy.py Telegram-upstream
          python3 nabdhgram/scripts/apply-nabdh-voice-clarity.py Telegram-upstream
          python3 nabdhgram/scripts/apply-nabdh-settings-order.py Telegram-upstream
          python3 nabdhgram/scripts/apply-nabdh-v1-user-features.py Telegram-upstream
          python3 nabdhgram/scripts/apply-nabdh-proxy-promo-controls.py Telegram-upstream

      - name: Install opt-in Camera2, browser and cached Channel Feed
        shell: bash
        run: |
          set -euo pipefail
          python3 nabdhgram/scripts/apply-nabdh-expanded-tools.py Telegram-upstream
          python3 nabdhgram/scripts/apply-nabdh-chat-lock.py Telegram-upstream
          python3 -m py_compile nabdhgram/scripts/apply-nabdh-ai-core.py
          python3 nabdhgram/scripts/apply-nabdh-ai-core.py Telegram-upstream
          # Assert exactly the intentionally listed non-runtime protoc
          # annotations; fail on broad suppressions or any unknown Protobuf rule.
          python3 - <<'PY'
          from pathlib import Path
          rules = Path("Telegram-upstream/TMessagesProj/proguard-rules.pro").read_text()
          required = {
              "-dontwarn com.google.protobuf.Internal$ProtoMethodMayReturnNull",
              "-dontwarn com.google.protobuf.Internal$ProtoNonnullApi",
              "-dontwarn com.google.protobuf.ProtoField",
              "-dontwarn com.google.protobuf.ProtoOneof",
              "-dontwarn com.google.protobuf.ProtoOneofCase",
              "-dontwarn com.google.protobuf.ProtoPresenceBits",
              "-dontwarn com.google.protobuf.ProtoPresenceCheckedField",
          }
          actual = [line.strip() for line in rules.splitlines()
                    if line.strip().startswith("-dontwarn com.google.protobuf.")]
          if len(actual) != len(required) or set(actual) != required:
              raise SystemExit("FAIL: expected only 7 exact Protobuf metadata annotations")
          assert "minifyEnabled true" in Path(
              "Telegram-upstream/TMessagesProj_App/build.gradle").read_text()
          print("PASS: R8 remains enabled; only 7 non-runtime metadata markers allowed")
          PY
          python3 nabdhgram/scripts/apply-nabdh-chat-lock-privacy.py Telegram-upstream

      - name: Unify chat bubble palette and native Arabic TextPaint refresh
        shell: bash
        run: |
          set -euo pipefail
          python3 nabdhgram/scripts/apply-nabdh-chat-consistency.py Telegram-upstream

      - name: Install approved NabdhGram logo in empty chats
        shell: bash
        run: |
          set -euo pipefail
          python3 nabdhgram/scripts/apply-nabdh-empty-state.py Telegram-upstream

      - name: Remove white shadow from native profile biography Glass card
        shell: bash
        run: |
          set -euo pipefail
          python3 nabdhgram/scripts/apply-nabdh-profile-bio-glass.py Telegram-upstream

      - name: Render compact grouped native NabdhGram settings
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile nabdhgram/scripts/apply-nabdh-compact-settings.py
          python3 nabdhgram/scripts/apply-nabdh-compact-settings.py Telegram-upstream

      - name: Install user-confirmed Telegram message scheduler
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile nabdhgram/scripts/apply-nabdh-message-scheduler.py
          python3 nabdhgram/scripts/apply-nabdh-message-scheduler.py Telegram-upstream

      - name: Install NabdhGram appearance and licensed original icon variants
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile nabdhgram/scripts/apply-nabdh-appearance-pack.py
          python3 nabdhgram/scripts/apply-nabdh-appearance-pack.py Telegram-upstream

      - name: Integrate real NabdhGram home, bubble, and Camera2 customization
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile nabdhgram/scripts/apply-nabdh-personalization.py
          python3 nabdhgram/scripts/apply-nabdh-personalization.py Telegram-upstream
          python3 nabdhgram/scripts/apply-nabdh-folder-badge-contrast.py Telegram-upstream

      - name: Hide unready V1 feature tiles without deleting future implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile nabdhgram/scripts/apply-nabdh-feature-visibility.py
          python3 nabdhgram/scripts/apply-nabdh-feature-visibility.py Telegram-upstream

      - name: Preserve native Telegram emoji tabs and Android system emoji choice
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile nabdhgram/scripts/apply-nabdh-stable-emoji-tabs.py
          python3 nabdhgram/scripts/apply-nabdh-stable-emoji-tabs.py Telegram-upstream

      - name: Verify rounded Profile bio presses and unified chat input
        shell: bash
        run: |
          set -euo pipefail
          python3 nabdhgram/scripts/check-profile-composer-visual-fixes.py Telegram-upstream

      - name: Enforce native toggle ON thumb physically left for every locale
        shell: bash
        run: |
          set -euo pipefail
          python3 nabdhgram/scripts/apply-fixed-left-toggle-thumb.py --apply Telegram-upstream

      - name: Constrain Android permissions and clean up media service lifecycle
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile nabdhgram/scripts/apply-nabdh-security-hardening.py
          python3 nabdhgram/scripts/apply-nabdh-security-hardening.py Telegram-upstream
          python3 -m py_compile nabdhgram/scripts/apply-nabdh-private-backup.py
          python3 nabdhgram/scripts/apply-nabdh-private-backup.py Telegram-upstream

      - name: Enable secure Android Auto notification messaging
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile nabdhgram/scripts/apply-nabdh-android-auto.py
          python3 nabdhgram/scripts/apply-nabdh-android-auto.py Telegram-upstream

      - name: Verify NabdhGram Glass overlays before Gradle
        shell: bash
