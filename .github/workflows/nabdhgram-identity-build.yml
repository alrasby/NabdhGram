          from pathlib import Path
          manifest = Path("apk-manifest-tree.txt").read_text(encoding="utf-8")
          match = re.search(r"(?m)^.*android:allowBackup.*$", manifest)
          if not match or not re.search(r"(?:0x0|false)\s*$", match.group(0), re.I):
