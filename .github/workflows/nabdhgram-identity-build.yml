          "$AAPT" dump permissions "$APK" > apk-permissions.txt
          # Android Auto support must survive variant merge, R8 and packaging.
          # Checking only the source manifest previously produced false positives.
          grep -Fq "com.google.android.gms.car.application" apk-manifest-tree.txt || {
            echo "::error::Final APK has no Android Auto application metadata"
