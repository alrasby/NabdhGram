name: Foundation checks

on:
  push:
    paths:
      - 'scripts/**'
      - 'docs/**'
      - '.github/workflows/foundation-checks.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify bootstrap scripts syntax
        shell: bash
        run: |
          bash -n scripts/bootstrap-upstream.sh
          bash -n scripts/verify-upstream.sh
      - name: Validate all Python overlay scripts before Android checkout
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast
          from pathlib import Path
          files = sorted(Path("scripts").glob("*.py"))
          for path in files:
              ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
          print(f"Validated {len(files)} Python scripts")
          PY
      - name: Self-test pinned upstream Java API preservation guard
        run: python3 scripts/check-upstream-api-preservation.py --self-test
      - name: Verify integrated Glass design contract
        run: python3 scripts/check-glass-design-contract.py
      - name: Ensure no Android APK is misrepresented
        run: |
          test -f docs/BUILD_SETUP.md
          test -f docs/UPSTREAM.md
          echo "Foundation source checks passed; Android compilation and device validation run separately."
