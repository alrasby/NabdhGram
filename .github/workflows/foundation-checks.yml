name: Foundation checks

on:
  # Avoid running Foundation twice for each push to an open PR: PR branches
  # run on pull_request, while the release baseline runs on direct main pushes.
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - 'docs/**'
      - '.github/workflows/foundation-checks.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify bootstrap scripts syntax
        shell: bash
        run: |
          bash -n scripts/bootstrap-upstream.sh
          bash -n scripts/verify-upstream.sh
          bash -n scripts/device-smoke-check.sh
          bash scripts/device-smoke-check.sh --help >/dev/null
          bash -n scripts/test-device-smoke.sh
          bash scripts/test-device-smoke.sh
      - name: Validate all Python overlay scripts before Android checkout
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast
          from pathlib import Path
          files = sorted(Path("scripts").glob("*.py"))
          for path in files:
              ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
          print(f"Validated {len(files)} Python scripts")
          PY
      - name: Self-test pinned upstream Java API preservation guard
        run: python3 scripts/check-upstream-api-preservation.py --self-test
      - name: Self-test Liquid Glass and local Lens safety
        run: python3 scripts/check-nabdh-liquid-intelligence.py --self-test
      - name: Test chat bubble palette and Arabic text-manager source
        run: python3 scripts/check-nabdh-chat-consistency.py --self-test
      - name: Verify integrated Glass design contract
        run: python3 scripts/check-glass-design-contract.py
      - name: Verify fixed-left ON thumb and native state invariants
        run: python3 scripts/apply-fixed-left-toggle-thumb.py --self-test
      - name: Test release signing guard and offline V1 engines
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/configure-release-signing.py --self-test
          python3 tools/setup-release-secrets.py --self-test
          python3 scripts/verify-release-apk.py --self-test
          python3 scripts/check-nabdh-v1-integration.py --self-test
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          javac -encoding UTF-8 -d "$tmpdir" overlay/java/NabdhV1Engine.java overlay/java/NabdhFileGuard.java tests/java/org/telegram/ui/Components/NabdhV1EngineSmokeTest.java
          java -cp "$tmpdir" org.telegram.ui.Components.NabdhV1EngineSmokeTest
      - name: Ensure no Android APK is misrepresented
        run: |
          test -f docs/BUILD_SETUP.md
          test -f docs/UPSTREAM.md
          echo "Foundation source checks passed; Android compilation and device validation run separately."
